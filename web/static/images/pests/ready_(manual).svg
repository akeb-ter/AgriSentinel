<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="416" height="256" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <circle cx="210" cy="118" r="85" fill="url(#glowGrad)" />

  <!-- Grid / Scientific Specimen Graph Backdrop -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <line x1="20" y1="50" x2="400" y2="50" />
    <line x1="20" y1="90" x2="400" y2="90" />
    <line x1="20" y1="130" x2="400" y2="130" />
    <line x1="20" y1="170" x2="400" y2="170" />
    <line x1="20" y1="210" x2="400" y2="210" />
    <line x1="70" y1="20" x2="70" y2="240" />
    <line x1="140" y1="20" x2="140" y2="240" />
    <line x1="210" y1="20" x2="210" y2="240" />
    <line x1="280" y1="20" x2="280" y2="240" />
    <line x1="350" y1="20" x2="350" y2="240" />
  </g>

  <!-- Specimen Icon Centerpiece -->
  <g transform="translate(160, 52) scale(1.0)">
    <ellipse cx="50" cy="52" rx="12" ry="24" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-width="2.5"/><circle cx="50" cy="24" r="8" fill="#059669" stroke="#34d399" stroke-width="2"/><path d="M46 18 L36 8 M54 18 L64 8" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/><path d="M40 44 L20 38 M60 44 L80 38 M38 56 L18 58 M62 56 L82 58 M40 68 L22 76 M60 68 L78 76" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Header Badge -->
  <rect x="20" y="16" width="130" height="22" rx="11" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1" />
  <text x="85" y="31" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    ORDER: DEFAULT
  </text>

  <!-- Card Title -->
  <text x="20" y="200" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">
    Ready (Manual)
  </text>

  <!-- Subtitle / Taxonomy -->
  <text x="20" y="222" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic">
    AgriSentinel Taxonomic Specimen Library • ready_(manual)
  </text>

  <!-- Corner Specimen Index -->
  <text x="395" y="31" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">
    SPECIMEN #5292
  </text>
</svg>